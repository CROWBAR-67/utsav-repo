<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <h1>My Dashboard</h1>
    <div class="stats">
      <div class="card" id="courses">Courses Completed: 5</div>
      <div class="card" id="assignments">Assignments Pending: 3</div>
      <div class="card" id="badges">Badges Earned: 2</div>
    </div>
    <div class="extra">
      <div class="card" id="progress">Overall Progress: 70%</div>
      <div class="card" id="deadline">Next Deadline: July 20</div>
      <div class="card" id="rank">Leaderboard Rank: #12</div>
    </div>
    <button class="update">Update Now</button>
  </div>
</body>
</html>
